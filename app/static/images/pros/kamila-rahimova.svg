<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 750" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1f1816"/>
      <stop offset="50%" stop-color="#141110"/>
      <stop offset="100%" stop-color="#0a0a0a"/>
    </linearGradient>
    <radialGradient id="spotlight2" cx="50%" cy="30%" r="50%">
      <stop offset="0%" stop-color="#D8BC88" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="600" height="750" fill="url(#bgGrad2)"/>
  <circle cx="300" cy="270" r="280" fill="url(#spotlight2)"/>
  
  <!-- Stylized Editorial Portrait: Kamila Rahimova (Art Director & Haute Colorist) -->
  <g transform="translate(0, 45)">
    <!-- Silk Atelier Blouse -->
    <path d="M 130 630 C 160 500, 210 450, 300 450 C 390 450, 440 500, 470 630 L 510 720 L 90 720 Z" fill="#18181b" stroke="#27272a" stroke-width="2"/>
    <!-- V-neckline & gold necklace -->
    <path d="M 255 450 L 300 525 L 345 450" fill="none" stroke="#cca385" stroke-width="2"/>
    <path d="M 270 480 Q 300 535 330 480" fill="none" stroke="#C5A46D" stroke-width="2"/>
    <circle cx="300" cy="510" r="4" fill="#C5A46D"/>
    
    <!-- Neck -->
    <rect x="270" y="340" width="60" height="115" rx="15" fill="#f0c9ab"/>
    
    <!-- Face / Head -->
    <ellipse cx="300" cy="265" rx="72" ry="98" fill="#f8d5be"/>
    
    <!-- Flowing Haute Balayage Hair -->
    <path d="M 210 240 C 200 130, 240 100, 300 95 C 360 100, 400 130, 390 240 C 410 320, 420 440, 410 520 C 395 530, 375 490, 370 430 C 360 300, 370 210, 300 210 C 230 210, 240 300, 230 430 C 225 490, 205 530, 190 520 C 180 440, 190 320, 210 240 Z" fill="#2d1d13"/>
    <!-- Dimensional Balayage Strands (Champagne highlights) -->
    <path d="M 235 220 Q 210 330 220 460" stroke="#C5A46D" stroke-width="3.5" fill="none" stroke-linecap="round"/>
    <path d="M 365 220 Q 390 330 380 460" stroke="#C5A46D" stroke-width="3.5" fill="none" stroke-linecap="round"/>
    <path d="M 285 110 Q 350 130 375 220" stroke="#dfc294" stroke-width="3" fill="none" stroke-linecap="round"/>
    
    <!-- Eyes, Brows & Lips -->
    <path d="M 252 245 Q 272 238 285 245" stroke="#2d1d13" stroke-width="3" fill="none" stroke-linecap="round"/>
    <path d="M 315 245 Q 328 238 348 245" stroke="#2d1d13" stroke-width="3" fill="none" stroke-linecap="round"/>
    <circle cx="270" cy="256" r="4" fill="#3f2719"/>
    <circle cx="330" cy="256" r="4" fill="#3f2719"/>
    <path d="M 300 250 L 297 285 L 304 285" stroke="#cca385" stroke-width="2" fill="none" stroke-linecap="round"/>
    <!-- Elegant Red/Berry Lip -->
    <path d="M 282 312 Q 300 308 318 312 Q 300 328 282 312 Z" fill="#a83a3a"/>
  </g>
  
  <!-- Subtle Editorial Frame & Typography Overlay -->
  <rect x="25" y="25" width="550" height="700" fill="none" stroke="#C5A46D" stroke-width="1" stroke-opacity="0.3"/>
  <text x="50" y="660" font-family="'Playfair Display', Georgia, serif" font-size="32" font-weight="600" fill="#F5F0E8" letter-spacing="1">Kamila Rahimova</text>
  <text x="50" y="690" font-family="'Plus Jakarta Sans', sans-serif" font-size="12" font-weight="500" fill="#C5A46D" letter-spacing="3">ART DIRECTOR &amp; HAUTE COLORIST</text>
  <text x="550" y="685" text-anchor="end" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="400" fill="#888888" letter-spacing="2">WO&amp;MAN ATELIER</text>
</svg>
