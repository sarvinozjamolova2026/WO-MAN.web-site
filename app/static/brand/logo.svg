<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 340 70" width="340" height="70" fill="none">
  <!-- WO&MAN Luxury Brand Wordmark -->
  <style>
    .brand-text {
      font-family: 'Playfair Display', 'Cormorant Garamond', 'Didot', 'Bodoni MT', 'Georgia', serif;
      font-size: 38px;
      font-weight: 600;
      letter-spacing: 0.18em;
      fill: #F5F0E8;
    }
    .brand-ampersand {
      font-family: 'Playfair Display', 'Didot', 'Georgia', serif;
      font-size: 34px;
      font-weight: 400;
      font-style: italic;
      fill: #C5A46D;
    }
    .brand-sub {
      font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      font-size: 8.5px;
      font-weight: 500;
      letter-spacing: 0.42em;
      fill: #9E804D;
      text-transform: uppercase;
    }
  </style>
  <g transform="translate(10, 42)">
    <text class="brand-text" x="0" y="0">WO<tspan class="brand-ampersand">&amp;</tspan>MAN</text>
  </g>
  <text class="brand-sub" x="12" y="60">GROOMING &amp; BEAUTY STUDIO</text>
</svg>
